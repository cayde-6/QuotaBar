name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail

          last_tag=$(git tag -l 'v*' | sort -V | tail -1)
          base_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" QuotaBar/Info.plist)
          next_version=$(bash scripts/next-version.sh "$base_version" "$last_tag")

          echo "last_tag=${last_tag}" >> "$GITHUB_OUTPUT"
          echo "next_version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "next_tag=v${next_version}" >> "$GITHUB_OUTPUT"

      - name: Write changelog
        env:
          LAST_TAG: ${{ steps.version.outputs.last_tag }}
        run: |
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"- %s" > CHANGELOG.txt
          else
            git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" > CHANGELOG.txt
          fi
          if [ ! -s CHANGELOG.txt ]; then
            echo "- No changes recorded" > CHANGELOG.txt
          fi

      - name: Set app version
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEXT_VERSION" QuotaBar/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" QuotaBar/Info.plist

      - name: Build
        run: |
          xcodebuild -project QuotaBar.xcodeproj -scheme QuotaBar -configuration Release -derivedDataPath build build

      - name: Package
        env:
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
        run: |
          brew install create-dmg

          create-dmg \
            --volname "QuotaBar" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "QuotaBar.app" 180 170 \
            --hide-extension "QuotaBar.app" \
            --app-drop-link 480 170 \
            "build/Build/Products/Release/QuotaBar-${NEXT_TAG}.dmg" \
            "build/Build/Products/Release/QuotaBar.app" || true

          test -f "build/Build/Products/Release/QuotaBar-${NEXT_TAG}.dmg"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
        run: |
          gh release create "$NEXT_TAG" \
            "build/Build/Products/Release/QuotaBar-${NEXT_TAG}.dmg" \
            --title "$NEXT_TAG" \
            --target "${{ github.sha }}" \
            --notes-file CHANGELOG.txt
